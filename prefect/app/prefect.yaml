name: hydrology
prefect-version: 3.9.1

# The flow code is bind-mounted into the worker at /prefect. Point the run's
# working directory at it so the relative entrypoint resolves; without this,
# Prefect copies the deployment from a temporary workspace and cannot find the
# flow file.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /prefect

deployments:
  - name: bronze-ingest
    description: >-
      Ingest raw USGS hydrology and Open-Meteo meteorology JSON into the bronze
      bucket for the three California monitoring stations, one partition per UTC
      day. Missing days are backfilled idempotently; existing days are skipped.
    entrypoint: flows/pipeline.py:bronze_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0200-utc
        cron: "0 2 * * *"
        timezone: UTC
        active: true

  - name: daily-bronze-silver
    description: >-
      Run the existing bronze ingestion and then the daily silver transform.
      Deactivate the bronze-ingest deployment above after enabling this one so
      each day is only ingested once.
    entrypoint: flows/daily_pipeline.py:daily_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0230-utc
        cron: "30 2 * * *"
        timezone: UTC
        active: true

  - name: silver-backfill
    description: >-
      Manual one-off backfill of the silver tables from the historic start date
      through the last complete local day. Runs as a single Spark job.
    entrypoint: flows/silver_flow.py:silver_pipeline
    parameters:
      backfill: true
    concurrency_limit: 1
    work_pool:
      name: local-pool
