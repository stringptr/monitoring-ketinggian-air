name: hydrology
prefect-version: 3.9.1

# The flow code is bind-mounted into the worker at /prefect. Point the run's
# working directory at it so the relative entrypoint resolves; without this,
# Prefect copies the deployment from a temporary workspace and cannot find the
# flow file.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /prefect

deployments:
  # Only daily-all is scheduled. It chains bronze, silver and gold in one run so
  # gold never reads silver that is still being written.
  - name: daily-all
    description: >-
      One daily run: bronze ingestion, native-resolution silver transform, then
      the hourly gold dataset. Each step starts only after the previous one
      completes, so the layers no longer depend on cron times to stay in order.
    entrypoint: flows/daily_all.py:daily_all
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0230-utc
        cron: "30 2 * * *"
        timezone: UTC
        active: true

  - name: bronze-ingest
    description: >-
      Manual or legacy bronze-only ingestion. Kept for reruns; its schedule is
      disabled because daily-all already runs bronze once per day.
    entrypoint: flows/pipeline.py:bronze_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0200-utc
        cron: "0 2 * * *"
        timezone: UTC
        active: false

  - name: daily-bronze-silver
    description: >-
      Legacy bronze+silver run kept for reruns. Its schedule is disabled in
      favour of daily-all, which adds gold to the same chain.
    entrypoint: flows/daily_pipeline.py:daily_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0230-utc
        cron: "30 2 * * *"
        timezone: UTC
        active: false

  - name: silver-backfill
    description: >-
      Manual one-off backfill of the native-resolution silver tables from the
      historic start date through the last complete UTC ingest day. The range
      is processed in calendar-year chunks.
    entrypoint: flows/silver_flow.py:silver_pipeline
    parameters:
      backfill: true
    concurrency_limit: 1
    work_pool:
      name: local-pool

  - name: daily-gold
    description: >-
      Manual gold-only run for the rolling window. Scheduled runs go through
      daily-all so gold cannot start before silver finishes.
    entrypoint: flows/gold_flow.py:gold_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0300-utc
        cron: "0 3 * * *"
        timezone: UTC
        active: false

  - name: gold-backfill
    description: >-
      Manual one-off rebuild of the gold tables from the historic start date
      through the last complete UTC day. Gold is fully rebuildable from silver,
      so this can be run whenever the feature definitions change.
    entrypoint: flows/gold_flow.py:gold_pipeline
    parameters:
      backfill: true
    concurrency_limit: 1
    work_pool:
      name: local-pool

  - name: train-models
    description: >-
      Train 3 stations x 3 horizons from gold/features, evaluate against
      persistence and apply the promotion gate. The schedule is inactive until
      the historical gold backfill is complete and the first run is validated.
    entrypoint: flows/training_flow.py:training_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: weekly-0400-utc
        cron: "0 4 * * 1"
        timezone: UTC
        active: false
