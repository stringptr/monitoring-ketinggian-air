name: hydrology
prefect-version: 3.9.1

# The flow code is bind-mounted into the worker at /prefect. Point the run's
# working directory at it so the relative entrypoint resolves; without this,
# Prefect copies the deployment from a temporary workspace and cannot find the
# flow file.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /prefect

deployments:
  - name: bronze-ingest
    description: >-
      Ingest raw USGS hydrology and Open-Meteo meteorology JSON into the bronze
      bucket for the three California monitoring stations, one partition per UTC
      day. Missing days are backfilled idempotently; existing days are skipped.
    entrypoint: flows/pipeline.py:bronze_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0200-utc
        cron: "0 2 * * *"
        timezone: UTC
        active: true

  - name: daily-bronze-silver
    description: >-
      Run the existing bronze ingestion and then the native-resolution silver
      transform. Deactivate the bronze-ingest deployment above after enabling
      this one so each day is only ingested once.
    entrypoint: flows/daily_pipeline.py:daily_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0230-utc
        cron: "30 2 * * *"
        timezone: UTC
        active: true

  - name: silver-backfill
    description: >-
      Manual one-off backfill of the native-resolution silver tables from the
      historic start date through the last complete UTC ingest day. The range
      is processed in calendar-year chunks.
    entrypoint: flows/silver_flow.py:silver_pipeline
    parameters:
      backfill: true
    concurrency_limit: 1
    work_pool:
      name: local-pool

  - name: daily-gold
    description: >-
      Build the hourly gold dataset and the model features from silver, then
      record the data-quality report and the dataset version. Runs after the
      daily bronze and silver deployments because it only reads silver.
    entrypoint: flows/gold_flow.py:gold_pipeline
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0300-utc
        cron: "0 3 * * *"
        timezone: UTC
        active: true

  - name: gold-backfill
    description: >-
      Manual one-off rebuild of the gold tables from the historic start date
      through the last complete UTC day. Gold is fully rebuildable from silver,
      so this can be run whenever the feature definitions change.
    entrypoint: flows/gold_flow.py:gold_pipeline
    parameters:
      backfill: true
    concurrency_limit: 1
    work_pool:
      name: local-pool
