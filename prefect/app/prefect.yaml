name: hydrology
prefect-version: 3.9.1

# The flow code is bind-mounted into the worker at /prefect. Point the run's
# working directory at it so the relative entrypoint resolves; without this,
# Prefect copies the deployment from a temporary workspace and cannot find the
# flow file.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /prefect

deployments:
  - name: bronze-ingest
    description: >-
      Ingest raw USGS hydrology and Open-Meteo meteorology JSON into the bronze
      bucket for the three California monitoring stations, one partition per UTC
      day. Missing days are backfilled idempotently; existing days are skipped.
    entrypoint: flows/pipeline.py:bronze_pipeline
    parameters:
      start_date: "2023-01-01"
    concurrency_limit: 1
    work_pool:
      name: local-pool
    schedules:
      - slug: daily-0200-utc
        cron: "0 2 * * *"
        timezone: UTC
        active: true
